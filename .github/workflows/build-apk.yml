name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project ZIP
        run: |
          ls -la
          unzip -l DailyEnglishGrowthAndroid.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir extracted
          unzip -o DailyEnglishGrowthAndroid.zip -d extracted
          find extracted -name gradlew -print

      - name: Build APK
        run: |
          cd extracted
          PROJECT_DIR=$(find . -name gradlew -print -quit | xargs dirname)
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyEnglishGrowth-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
